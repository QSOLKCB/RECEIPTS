name: Compare GPT-4o and GPT-4.1
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: receipts-legacy-model-comparison
  cancel-in-progress: false
jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[receipts-compare]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: ['gpt-4o-2024-11-20', 'gpt-4.1-2025-04-14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify harness
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run frozen paired comparison
        env:
          PYTHONPATH: src
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_ID: ${{ matrix.model }}
        run: python -m receipts.runner --output artifacts/model-run --model "$MODEL_ID" --cases 16 --seed 42 --max-output-tokens 1200
      - name: Publish experiment summary
        if: always()
        run: |
          if [ -f artifacts/model-run/summary.md ]; then
            cat artifacts/model-run/summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f artifacts/model-run/manifest.json ]; then
            python -c 'import json; p=json.load(open("artifacts/model-run/manifest.json")); print("Run status:", p["status"], "\nModel calls completed:", p["completed_calls"])' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: comparison-${{ matrix.model }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/model-run/
          if-no-files-found: warn
          retention-days: 30
