name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Behavioral regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Verify preserved experiment records
        run: |
          python experiments/preservation-2026-10-30/verify.py
          python -O experiments/preservation-2026-10-30/verify.py
      - name: Prepare paired experiment without inference
        env:
          PYTHONPATH: src
        run: python -m receipts.runner --dry-run --output artifacts/dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-experiment
          path: artifacts/dry-run/
          retention-days: 14

  rust-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting, tests and lints
        run: |
          cargo fmt --all -- --check
          cargo test --locked --offline
          cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Build and test Rust to Python boundary without inference
        run: |
          cargo build --locked --offline
          python -m unittest discover -s cli/tests -v
